name: Release
run-name: Release triggered by ${{ github.actor }}

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Publishes only when package.json's version is not yet on npm, so ordinary
      # merges are no-ops and a version bump merge releases.
      - name: Check whether this version is already published
        id: check
        run: |
          v="${{ steps.version.outputs.version }}"
          if npm view "@baz-scm/jira-tui@$v" version >/dev/null 2>&1; then
            echo "v$v already on npm — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Auth via npm Trusted Publishing (OIDC): configure this repo + workflow as the
      # trusted publisher on npmjs.com for @baz-scm/jira-tui. No NPM_TOKEN needed.
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
